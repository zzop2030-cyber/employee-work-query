<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلام عمل الموظف</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 650px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd1d1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1f618d;
        }
        #result {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            display: none;
            line-height: 1.8;
        }
        .success-res {
            color: #27ae60;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }
        .error-res {
            color: #c0392b;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>بوابة استعلام عمل الموظف</h2>
        <div class="form-group">
            <label for="empID">أدخل رقم الموظف أو الهوية:</label>
            <input type="text" id="empID" placeholder="مثال: 1001">
        </div>
        <button onclick="searchEmployee()">بحث والاستعلام</button>

        <div id="result"></div>
    </div>

    <script>
        // قاعدة بيانات الموظفين مباشرة داخل الصفحة لضمان عملها بسلاسة
        const employeesData = {
            "1001": { 
                name: "محمد أحمد", 
                job: "إداري", 
                department: "الشؤون الإدارية", 
                qualification: "بكالوريوس إدارة أعمال", 
                status: "على رأس العمل" 
            },
            "1002": { 
                name: "سارة خالد", 
                job: "مهندسة برمجيات", 
                department: "تقنية المعلومات", 
                qualification: "بكالوريوس علوم حاسب", 
                status: "على رأس العمل" 
            },
            "1003": { 
                name: "عبدالله العتيبي", 
                job: "محاسب", 
                department: "المالية", 
                qualification: "بكالوريوس محاسبة", 
                status: "على رأس العمل" 
            }
        };

        function searchEmployee() {
            var id = document.getElementById('empID').value.trim();
            var resultDiv = document.getElementById('result');
            
            if(id === "") {
                alert("الرجاء إدخال رقم الموظف للبحث");
                return;
            }

            resultDiv.style.display = "block";
            
            if(employeesData[id]) {
                var emp = employeesData[id];
                resultDiv.innerHTML = `
                    <div class="success-res">✅ تم العثور على بيانات الموظف</div>
                    👤 <strong>اسم الموظف:</strong> ${emp.name}<br>
                    💼 <strong>المسمى الوظيفي:</strong> ${emp.job}<br>
                    🏢 <strong>القسم / الإدارة:</strong> ${emp.department}<br>
                    🎓 <strong>المؤهل العلمي:</strong> ${emp.qualification}<br>
                    🟢 <strong>حالة العمل:</strong> ${emp.status}
                `;
            } else {
                resultDiv.innerHTML = `<div class="error-res">❌ عذراً، لم يتم العثور على موظف مسجل بهذا الرقم (${id}).</div>`;
            }
        }
    </script>

</body>
</html>
