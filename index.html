<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعة خليج السدرة - بوابة استعلام موظف</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 650px;
            margin: 35px auto;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #0b2e8a;
        }
        .header-section {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e9ecef;
        }
        .logo-img {
            max-width: 240px;
            height: auto;
            margin-bottom: 10px;
            display: inline-block;
        }
        .uni-name {
            color: #0b2e8a;
            font-size: 22px;
            font-weight: bold;
            margin: 4px 0;
        }
        .office-name {
            color: #8c7324;
            font-size: 17px;
            font-weight: bold;
            margin: 4px 0 14px 0;
        }
        h2 {
            color: #2c3e50;
            font-size: 20px;
            margin: 8px 0 0 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd1d1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: right;
        }
        input:focus {
            border-color: #0b2e8a;
            outline: none;
        }
        button {
            width: 100%;
            padding: 13px;
            background-color: #0b2e8a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #082166;
        }
        #result {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            display: none;
            line-height: 2;
        }
        .success-res {
            color: #27ae60;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }
        .error-res {
            color: #c0392b;
            font-weight: bold;
            text-align: center;
        }
        .info-row {
            margin-bottom: 6px;
            font-size: 15px;
        }
    </style>
</head>

        function searchEmployee() {
            var id = document.getElementById('empID').value.trim();
            var resultDiv = document.getElementById('result');
            
            if(id === "") {
                alert("الرجاء إدخال الرقم الوطني للبحث");
                return;
            }

            resultDiv.style.display = "block";
            
            if(employeesData[id]) {
                var emp = employeesData[id];
                resultDiv.innerHTML = `
                    <div class="success-res">✅ تم العثور على بيانات الموظف</div>
                    <div class="info-row">👤 <strong>اسم الموظف:</strong> ${emp.name}</div>
                    <div class="info-row">🆔 <strong>الرقم الوطني:</strong> ${id}</div>
                    <div class="info-row">🎓 <strong>المؤهل العلمي والتخصص:</strong> ${emp.qualification}</div>
                    <div class="info-row">🏢 <strong>مكان العمل المنسب له:</strong> ${emp.workplace}</div>
                `;
            } else {
                resultDiv.innerHTML = `<div class="error-res">❌ عذراً، لم يتم العثور على موظف مسجل بهذا الرقم الوطني (${id}).</div>`;
            }
        }
    </script>
